# Groups are shortcuts. A machine lists groups and/or single packages.
# Names that aren't a group are installed as a brew formula, unless they
# appear in some group's `cask` list. Taps are derived from "owner/tap/name".

[packages.groups.ai]
brew = ["fabric-ai", "opencode"]
cask = ["claude-code", "codex"]

[packages.groups.base]
brew = [
  "age",
  "bat",
  "bitwarden-cli",
  "btop",
  "chezmoi",
  "commitizen",
  "eza",
  "fd",
  "fzf",
  "gcc",
  "git",
  "git-delta",
  "herdr",
  "imagemagick",
  "lazygit",
  "mise",
  "neovim",
  "oh-my-posh",
  "ripgrep",
  "sops",
  "tlrc",
  "tmux",
  "tree-sitter-cli",
  "yazi",
  "yq",
  "zoxide",
  "zsh",
]
cask = ["font-jetbrains-mono-nerd-font"]

[packages.groups.cloud]
brew = ["oci-cli"]

[packages.groups.containers]
brew = ["podman", "podman-tui"]

[packages.groups.dev]
brew = ["uv"]

[packages.groups.iac]
brew = ["ansible", "hashicorp/tap/terraform"]

[packages.groups.k8s]
brew = [
  "argocd",
  "cilium-cli",
  "helm",
  "k9s",
  "kubectx",
  "kubelogin",
  "kubernetes-cli",
]

[packages.groups.linux]
brew = ["keychain"]

[packages.groups.mac]
brew = ["felixkratz/formulae/borders", "ffmpeg", "mas", "yt-dlp"]
cask = [
  "betterdisplay",
  "brave-browser",
  "calibre",
  "discord",
  "firefox",
  "firefox@developer-edition",
  "ghostty",
  "keka",
  "microsoft-outlook",
  "microsoft-teams",
  "moonlight",
  "nikitabobko/tap/aerospace",
  "obsidian",
  "proton-mail",
  "protonvpn",
  "qbittorrent",
  "raycast",
  "signal",
  "slack",
  "steam",
  "synology-drive",
  "unnaturalscrollwheels",
  "vlc",
]
mas = { Bitwarden = 1352778147, Readest = 6738622779, SteamLink = 1246969117, WindowsApp = 1295203466 }

[packages.groups.vm]
brew = ["lima"]

[packages.machines]
lindev = ["base", "k8s", "claude-code", "linux"]
mac = ["base", "ai", "k8s", "containers", "iac", "mac", "vm"]
wsl = ["base", "claude-code", "k8s", "iac", "linux", "autossh", "dev"]

[packages.skip]
lindev = []
wsl = []
