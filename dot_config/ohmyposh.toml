#:schema https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

console_title_template = '{{ .Folder }}{{ if .Env.SSH_CONNECTION }} @ {{ .HostName }}{{ end }}'
version = 4
final_space = true
async = true
enable_cursor_positioning = true

[upgrade]
notice = false
interval = "168h"
auto = false
source = "cdn"

[palette]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'os'
style = 'plain'
foreground = 'p:text'
template = ' {{ .Icon }} '

[[blocks.segments]]
type = "text"
style = "plain"
foreground = "p:teal"
template = "{{ if .WSL }}wsl {{ end }}"

[[blocks.segments]]
type = 'path'
style = 'plain'
foreground = 'p:blue'
background = 'transparent'
template = '{{ .Path }}'

[blocks.segments.options]
style = 'full'

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'p:green'
foreground_templates = [
  '{{ if or (.Working.Unmerged) (.Staging.Unmerged) }}p:red{{ end }}',
  '{{ if or (.Working.Changed) (.Staging.Changed) }}p:peach{{ end }}',
  '{{ if or (gt .Ahead 0) (gt .Behind 0) }}p:mauve{{ end }}',
]
background = 'transparent'
template = " {{ .UpstreamIcon }} {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}"

[blocks.segments.options]
branch_icon = ''
commit_icon = '@'

[[blocks.segments]]
type = "sshagent"
style = "plain"
foreground = "p:red"
template = "{{ if not .Running }}  no agent{{ else if eq .Count 0 }}  no keys{{ end }}"

[[blocks]]
type = 'prompt'
alignment = 'right'

[[blocks.segments]]
type = "go"
style = "diamond"
leading_diamond = ""
trailing_diamond = ""
foreground = "p:sky"
background = "p:surface0"
template = "  {{ .Full }} "

[[blocks.segments]]
type = "python"
style = "diamond"
leading_diamond = ""
trailing_diamond = ""
foreground = "p:yellow"
background = "p:surface0"
template = "  {{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }} "

[blocks.segments.options]
display_mode = "context"

[[blocks.segments]]
type = "node"
style = "diamond"
leading_diamond = ""
trailing_diamond = ""
foreground = "p:green"
foreground_templates = ['{{ if .Mismatch }}p:red{{ end }}']
background = "p:surface0"
template = "  {{ .Full }}{{ if .Mismatch }} (want {{ .Expected }}){{ end }}{{ if .PackageManagerIcon }} {{ .PackageManagerIcon }}{{ end }} "

[blocks.segments.options]
fetch_package_manager = true

[[blocks.segments]]
type = "lua"
style = "diamond"
leading_diamond = ""
trailing_diamond = ""
foreground = "p:blue"
background = "p:surface0"
template = "  {{ .Full }} "

[[blocks.segments]]
type = "rust"
style = "diamond"
leading_diamond = ""
trailing_diamond = ""
foreground = "p:peach"
background = "p:surface0"
template = "  {{ .Full }} "

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'p:yellow'
background = 'transparent'
template = '{{ .FormattedMs }}'

[blocks.segments.options]
threshold = 500
style = 'round'

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'p:red'
background = 'transparent'
template = '{{ if gt .Code 0 }} ✘ {{ .Code }}{{ end }}'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground_templates = [
  '{{if eq .Code 0}}p:teal{{end}}',
  '{{if gt .Code 0}}p:red{{end}}',
]
background = 'transparent'
template = '❯'

[transient_prompt]
foreground_templates = [
  '{{if eq .Code 0}}p:teal{{end}}',
  '{{if gt .Code 0}}p:red{{end}}',
]
background = 'transparent'
template = '❯ '

[secondary_prompt]
foreground = 'p:teal'
background = 'transparent'
template = '❯❯ '


# Tooltips
[[tooltips]]
type = "kubectl"
tips = ["kubectl", "k", "helm", "k9s", "kubens", "kns", "kubectx", "kctx", "cilium"]
style = "diamond"
foreground = "p:blue"
foreground_templates = [
  '{{ if hasSuffix "-prod" .Context }}p:red{{ end }}',
  '{{ if hasSuffix "-accpt" .Context }}p:peach{{ end }}',
]
background = "p:surface0"
leading_diamond = ""
trailing_diamond = ""
template = "󰠳 {{ .Context }} · {{ if .Namespace }}{{ .Namespace }}{{ else }}default{{ end }}"

[[tooltips]]
type = "terraform"
tips = ["terraform"]
style = "diamond"
foreground = "p:mauve"
foreground_templates = ['{{ if contains "prod" .WorkspaceName }}p:red{{ end }}']
background = "p:surface0"
leading_diamond = ""
trailing_diamond = ""
template = "󱁢 {{ .WorkspaceName }}"

[[tooltips]]
type = "terraform"
tips = ["tofu"]
style = "diamond"
foreground = "p:yellow"
foreground_templates = ['{{ if contains "prod" .WorkspaceName }}p:red{{ end }}']
background = "p:surface0"
leading_diamond = ""
trailing_diamond = ""
template = "󱁢 {{ .WorkspaceName }}"

[tooltips.options]
command = "tofu"

[[tooltips]]
type = "argocd"
tips = ["argocd"]
style = "diamond"
foreground = "p:peach"
background = "p:surface0"
leading_diamond = ""
trailing_diamond = ""
template = " {{ .Name }}{{ .Server }}{{ .User }}"

[[tooltips]]
type = "sshagent"
tips = ["ssh", "scp", "rsync", "sftp"]
style = "diamond"
foreground = "p:lavender"
background = "p:surface0"
leading_diamond = ""
trailing_diamond = ""
template = " {{ .Keys }}"

[tooltips.options]
key_separator = " · "
